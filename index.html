<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>几何体外接球演示系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2a3a7c, #3a4a8c);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .control-panel {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .viewer {
            flex: 2;
            min-width: 400px;
            height: 500px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .shape-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .shape-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1rem;
        }
        
        .shape-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .shape-btn.active {
            background: rgba(74, 144, 226, 0.5);
            border-color: #4a90e2;
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.5);
        }
        
        .controls-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .controls-info h3 {
            margin-bottom: 10px;
            color: #4a90e2;
        }
        
        .controls-info ul {
            list-style-type: none;
            padding-left: 10px;
        }
        
        .controls-info li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .controls-info li:before {
            content: "•";
            color: #4a90e2;
            font-weight: bold;
            margin-right: 10px;
        }
        
        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .info-panel h3 {
            margin-bottom: 10px;
            color: #4a90e2;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            opacity: 0.7;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }
            
            .viewer {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>几何体外接球演示系统</h1>
            <p class="subtitle">交互式3D几何体外接球可视化工具</p>
        </header>
        
        <div class="content">
            <div class="control-panel">
                <h2>选择几何体</h2>
                <div class="shape-selector">
                    <div class="shape-btn active" data-shape="cube">正方体</div>
                    <div class="shape-btn" data-shape="cuboid">长方体</div>
                    <div class="shape-btn" data-shape="prism">三棱柱</div>
                    <div class="shape-btn" data-shape="pyramid">三棱锥</div>
                </div>
                
                <div class="info-panel">
                    <h3>几何体信息</h3>
                    <p id="shape-info">正方体: 所有边长相等的六面体，外接球球心位于体对角线交点。</p>
                </div>
                
                <div class="controls-info">
                    <h3>操作指南</h3>
                    <ul>
                        <li>鼠标拖动：旋转视角</li>
                        <li>鼠标滚轮：缩放视图</li>
                        <li>右键拖动：平移视图</li>
                    </ul>
                </div>
            </div>
            
            <div class="viewer" id="viewer">
                <!-- 3D场景将在这里渲染 -->
            </div>
        </div>
        
        <footer>
            <p>几何体外接球演示系统 &copy; 2023 | 使用Three.js构建</p>
        </footer>
    </div>

    <!-- 引入Three.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    
    <script>
        // 初始化Three.js场景
        let scene, camera, renderer, controls;
        let currentShape = null;
        let sphere = null;
        
        // 几何体参数
        const shapes = {
            cube: { name: "正方体", info: "正方体: 所有边长相等的六面体，外接球球心位于体对角线交点。" },
            cuboid: { name: "长方体", info: "长方体: 长宽高不同的六面体，外接球球心位于体对角线交点。" },
            prism: { name: "三棱柱", info: "三棱柱: 两个平行且全等的三角形底面，三个矩形侧面，外接球球心位于两个底面外心连线的中点。" },
            pyramid: { name: "三棱锥", info: "三棱锥: 三角形底面和三个三角形侧面，外接球球心位于各顶点距离相等的点。" }
        };
        
        // 初始化函数
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a2a6c);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, document.getElementById('viewer').offsetWidth / document.getElementById('viewer').offsetHeight, 0.1, 1000);
            camera.position.z = 5;
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(document.getElementById('viewer').offsetWidth, document.getElementById('viewer').offsetHeight);
            document.getElementById('viewer').appendChild(renderer.domElement);
            
            // 添加轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // 添加定向光
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // 添加坐标轴辅助
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);
            
            // 初始创建正方体
            createCube();
            
            // 窗口大小变化时调整渲染器尺寸
            window.addEventListener('resize', onWindowResize);
            
            // 渲染循环
            animate();
        }
        
        // 窗口大小变化处理
        function onWindowResize() {
            camera.aspect = document.getElementById('viewer').offsetWidth / document.getElementById('viewer').offsetHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(document.getElementById('viewer').offsetWidth, document.getElementById('viewer').offsetHeight);
        }
        
        // 创建正方体
        function createCube() {
            clearScene();
            
            const size = 1.5;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x4a90e2, 
                transparent: true, 
                opacity: 0.7,
                shininess: 100
            });
            
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
            
            // 添加边框
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            currentShape.add(line);
            
            // 添加外接球
            const sphereRadius = Math.sqrt(3) * size / 2;
            const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xff6b6b, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            
            sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            scene.add(sphere);
        }
        
        // 创建长方体
        function createCuboid() {
            clearScene();
            
            const width = 2, height = 1, depth = 1.5;
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x4a90e2, 
                transparent: true, 
                opacity: 0.7,
                shininess: 100
            });
            
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
            
            // 添加边框
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            currentShape.add(line);
            
            // 添加外接球
            const sphereRadius = Math.sqrt(width*width + height*height + depth*depth) / 2;
            const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xff6b6b, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            
            sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            scene.add(sphere);
        }
        
        // 创建三棱柱
        function createPrism() {
            clearScene();
            
            // 创建三棱柱的顶点
            const vertices = new Float32Array([
                // 底面三角形
                0, -1, 1,    // 顶点0
                -1, -1, -1,  // 顶点1
                1, -1, -1,   // 顶点2
                
                // 顶面三角形
                0, 1, 1,     // 顶点3
                -1, 1, -1,   // 顶点4
                1, 1, -1     // 顶点5
            ]);
            
            // 创建三棱柱的面
            const indices = [
                // 底面
                0, 1, 2,
                // 顶面
                3, 5, 4,
                // 侧面1
                0, 3, 4,
                0, 4, 1,
                // 侧面2
                1, 4, 5,
                1, 5, 2,
                // 侧面3
                2, 5, 3,
                2, 3, 0
            ];
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x4a90e2, 
                transparent: true, 
                opacity: 0.7,
                side: THREE.DoubleSide,
                shininess: 100
            });
            
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
            
            // 添加边框
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            currentShape.add(line);
            
            // 添加外接球
            const sphereRadius = 1.8;
            const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xff6b6b, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            
            sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            scene.add(sphere);
        }
        
        // 创建三棱锥 - 修正版本
        function createPyramid() {
            clearScene();
            
            // 先生成一个球体，然后在球面上选取四个不共面的点
            const sphereRadius = 1.5;
            
            // 在球面上选取四个不共面的点
            // 使用球面坐标 (r, θ, φ) 来选取点
            const points = [];
            
            // 第一个点：北极附近
            points.push(sphericalToCartesian(sphereRadius, 0, 0));
            
            // 第二个点：南半球
            points.push(sphericalToCartesian(sphereRadius, Math.PI * 0.8, Math.PI * 0.5));
            
            // 第三个点：赤道附近
            points.push(sphericalToCartesian(sphereRadius, Math.PI * 0.5, Math.PI * 1.2));
            
            // 第四个点：赤道附近，与第三个点相对
            points.push(sphericalToCartesian(sphereRadius, Math.PI * 0.5, Math.PI * 1.8));
            
            // 创建三棱锥的顶点
            const vertices = new Float32Array([
                // 四个点
                points[0].x, points[0].y, points[0].z,  // 顶点0
                points[1].x, points[1].y, points[1].z,  // 顶点1
                points[2].x, points[2].y, points[2].z,  // 顶点2
                points[3].x, points[3].y, points[3].z   // 顶点3
            ]);
            
            // 创建三棱锥的面
            const indices = [
                // 底面 (顶点1,2,3)
                1, 3, 2,
                // 侧面1 (顶点0,1,2)
                0, 1, 2,
                // 侧面2 (顶点0,2,3)
                0, 2, 3,
                // 侧面3 (顶点0,3,1)
                0, 3, 1
            ];
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x4a90e2, 
                transparent: true, 
                opacity: 0.7,
                side: THREE.DoubleSide,
                shininess: 100
            });
            
            currentShape = new THREE.Mesh(geometry, material);
            scene.add(currentShape);
            
            // 添加边框
            const edges = new THREE.EdgesGeometry(geometry);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
            currentShape.add(line);
            
            // 添加外接球
            const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xff6b6b, 
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            
            sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            scene.add(sphere);
        }
        
        // 球面坐标转笛卡尔坐标
        function sphericalToCartesian(radius, theta, phi) {
            const x = radius * Math.sin(theta) * Math.cos(phi);
            const y = radius * Math.cos(theta);
            const z = radius * Math.sin(theta) * Math.sin(phi);
            return new THREE.Vector3(x, y, z);
        }
        
        // 清除场景中的几何体和球体
        function clearScene() {
            if (currentShape) {
                scene.remove(currentShape);
                currentShape = null;
            }
            if (sphere) {
                scene.remove(sphere);
                sphere = null;
            }
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // 页面加载完成后初始化
        window.onload = init;
        
        // 添加几何体选择事件
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 移除所有按钮的active类
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                // 为当前按钮添加active类
                this.classList.add('active');
                
                // 获取选择的几何体类型
                const shapeType = this.getAttribute('data-shape');
                
                // 更新信息面板
                document.getElementById('shape-info').textContent = shapes[shapeType].info;
                
                // 创建对应的几何体
                switch(shapeType) {
                    case 'cube':
                        createCube();
                        break;
                    case 'cuboid':
                        createCuboid();
                        break;
                    case 'prism':
                        createPrism();
                        break;
                    case 'pyramid':
                        createPyramid();
                        break;
                }
            });
        });
    </script>
</body>
</html>
